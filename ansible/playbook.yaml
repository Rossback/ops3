- name: Configure Minecraft Server
  hosts: minecraft
  become: true

  vars:
    container_name: minecraft
    world_dir: /data
    ecr_repo: "{{ ecr_url }}"
    tag_version: "v1.0.0"
    aws_region: "us-east-1"

  tasks:
    - name: Install Docker and AWS CLI
      apt:
        name:
          - docker.io
          - awscli
        state: present
        update_cache: yes

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Create Minecraft world directory
      file:
        path: "{{ world_dir }}"
        state: directory
        mode: "0755"

    - name: Authenticate Docker to ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} \
        | docker login --username AWS --password-stdin {{ ecr_repo }}
      args:
        executable: /bin/bash

    - name: Restore world from S3
      shell: |
        aws s3 sync s3://{{ s3_bucket }} {{ world_dir }}
      ignore_errors: yes

    - name: Stop existing container if running
      shell: docker rm -f {{ container_name }}
      ignore_errors: yes

    - name: Pull Minecraft image from ECR
      shell: docker pull {{ ecr_repo }}:{{ tag_version }}

    - name: Run Minecraft container
      community.docker.docker_container:
        name: minecraft
        image: "{{ ecr_repo }}:{{ tag_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "25565:25565"
        volumes:
          - "{{ world_dir }}:/data"
        env:
          EULA: "TRUE"
          VERSION: "1.21.1"
          MOTD: "Sam Rossback rossbacs"

    - name: Wait for Minecraft server to initialize
      pause:
        seconds: 60
